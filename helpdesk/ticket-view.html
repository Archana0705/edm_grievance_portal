<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Ticket Details - EDM Dashboard</title>

    <!-- Bootstrap CSS -->
    <link href="../assets/css/bootstrap.min.css" rel="stylesheet">
    <link href="../assets/font/bootstrap-icons.css" rel="stylesheet">
    <link href="../assets/css/aos.css" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/global.css">

    <style>
        body {
            background-color: #f9f9fb;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .page-header {
            border-bottom: 2px solid #eee;
            margin-bottom: 20px;
            padding-bottom: 10px;
        }

        .ticket-meta {
            background: #fff;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.05);
        }

        .action-box {
            background: #fff;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.05);
        }

        .comment-box {
            margin-top: 15px;
        }

        .action-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 10px;
        }

        /* Timeline Styles */
        .timeline {
            border-left: 3px solid #4b6cb7;
            margin-left: 20px;
            padding-left: 25px;
            position: relative;
        }

        .timeline-item {
            position: relative;
            margin-bottom: 20px;
        }

        .timeline-item::before {
            content: '';
            position: absolute;
            left: -28px;
            top: 5px;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #4b6cb7;
        }

        .timeline-item-first::before {
            background: #28a745;
        }

        .timeline-item-last::before {
            background: #6c757d;
        }

        .timeline-content {
            background: #f8f9fa;
            border-radius: 8px;
            padding: 15px;
            border-left: 3px solid #dee2e6;
        }

        /* Header */
        nav.navbar {
            background: linear-gradient(90deg, #4b6cb7, #182848);
            color: #fff;
            z-index: 1000;
            padding: 0.4rem 1rem;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        nav.navbar .navbar-brand,
        nav.navbar .btn,
        nav.navbar span {
            color: #fff;
        }

        nav.navbar .btn-light {
            background: rgba(255, 255, 255, 0.15);
            border: none;
            color: #fff;
        }

        nav.navbar .btn-light:hover {
            background: rgba(255, 255, 255, 0.25);
        }

        /* Sidebar */
        #sidebar {
            position: fixed;
            top: 70px;
            left: 0;
            width: 220px;
            height: calc(100% - 70px);
            background: #fff;
            padding-top: 1rem;
            transition: all 0.3s;
            overflow-y: auto;
            border-right: 1px solid #e0e0e0;
            box-shadow: 2px 0 5px rgba(0, 0, 0, 0.05);
            z-index: 999;
        }

        #sidebar a {
            display: flex;
            align-items: center;
            padding: 12px 20px;
            color: #495057;
            text-decoration: none;
            font-weight: 500;
            border-radius: 8px;
            margin: 4px 10px;
            transition: all 0.2s ease-in-out;
        }

        #sidebar a:hover {
            background: #4b6cb7;
            color: #fff;
            transform: translateX(5px);
        }

        #sidebar a.active {
            background: #182848;
            color: white;
        }

        #sidebar i {
            margin-right: 12px;
            font-size: 1.2rem;
        }

        .sidebar-collapsed #sidebar a {
            padding: 12px 0px;
        }

        /* Collapsed sidebar */
        body.sidebar-collapsed #sidebar {
            width: 60px;
        }

        body.sidebar-collapsed #sidebar a span {
            display: none;
        }

        body.sidebar-collapsed #sidebar a i {
            margin-right: 0;
            width: 100%;
            text-align: center;
        }

        /* Main content */
        #mainContent {
            margin-left: 220px;
            padding: 30px;
            flex: 1;
            transition: all 0.3s;
            min-height: calc(100vh - 130px);
        }

        body.sidebar-collapsed #mainContent {
            margin-left: 60px;
        }

        /* Footer */
        footer {
            background: #fff;
            text-align: center;
            padding: 15px;
            border-top: 1px solid #ddd;
            width: 100%;
            box-shadow: 0 -2px 8px rgba(0, 0, 0, 0.05);
            margin-left: 220px;
            transition: all 0.3s;
        }

        body.sidebar-collapsed footer {
            margin-left: 60px;
        }

        /* Mobile responsiveness */
        @media (max-width: 992px) {
            #sidebar {
                left: -100%;
                top: 0;
                width: 220px;
                height: 100%;
                border-right: none;
                box-shadow: 2px 0 15px rgba(0, 0, 0, 0.2);
                z-index: 9999;
            }

            #sidebar.show {
                left: 0;
            }

            #mainContent {
                margin-left: 0;
                padding: 20px 10px;
            }

            body.sidebar-collapsed #mainContent {
                margin-left: 0;
            }

            footer {
                margin-left: 0 !important;
            }
        }

        @media (max-width: 768px) {
            #currentDateTime {
                display: none;
            }

            .navbar .fw-bold {
                font-size: 1.1rem;
            }

            #sidebarToggle {
                padding: 0.35rem 0.6rem;
            }

            .dropdown-toggle span {
                display: none;
            }

            .action-buttons {
                flex-direction: column;
            }

            .action-buttons .btn {
                width: 100%;
            }

            .ticket-meta .row>div {
                margin-bottom: 15px;
            }

            .timeline {
                margin-left: 10px;
                padding-left: 15px;
            }

            .timeline-item::before {
                left: -18px;
            }
        }

        /* Loading Spinner */
        .loading-spinner {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.8);
            z-index: 9999;
            justify-content: center;
            align-items: center;
        }

        .loading-spinner.show {
            display: flex;
        }
    </style>
</head>

    <!-- Main Application Script -->
    <script>
        // Global variables
        let currentTicketId = null;
        let currentTicketData = null;
        let currentUser = null;

        // ============ UTILITY FUNCTIONS ============

        function showLoading(show) {
            const spinner = document.getElementById('loadingSpinner');
            if (show) {
                spinner.classList.add('show');
            } else {
                spinner.classList.remove('show');
            }
        }

        function showToast(message, type = 'info') {
            if (typeof showCustomToast === 'function') {
                showCustomToast(message, type);
            } else {
                // Fallback toast
                const toastHtml = `
          <div class="toast align-items-center text-white bg-${type} border-0" role="alert">
            <div class="d-flex">
              <div class="toast-body">${message}</div>
              <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
            </div>
          </div>
        `;
                const toastContainer = document.getElementById('toastContainer') || (() => {
                    const container = document.createElement('div');
                    container.id = 'toastContainer';
                    container.className = 'position-fixed top-0 end-0 p-3';
                    container.style.zIndex = '9999';
                    document.body.appendChild(container);
                    return container;
                })();

                toastContainer.insertAdjacentHTML('beforeend', toastHtml);
                const toastElement = toastContainer.lastElementChild;
                const toast = new bootstrap.Toast(toastElement);
                toast.show();

                toastElement.addEventListener('hidden.bs.toast', () => {
                    toastElement.remove();
                });
            }
        }

        function getUrlParameter(name) {
            name = name.replace(/[\[\]]/g, '\\$&');
            const regex = new RegExp('[?&]' + name + '(=([^&#]*)|&|#|$)');
            const results = regex.exec(window.location.search);
            if (!results) return null;
            if (!results[2]) return '';
            return decodeURIComponent(results[2].replace(/\+/g, ' '));
        }

        function formatDateTime(dateString) {
            if (!dateString || dateString === 'null' || dateString === 'undefined') return '-';
            try {
                const date = new Date(dateString);
                if (isNaN(date.getTime())) return '-';
                return date.toLocaleString('en-IN', {
                    day: '2-digit',
                    month: 'short',
                    year: 'numeric',
                    hour: '2-digit',
                    minute: '2-digit',
                    hour12: true
                });
            } catch (e) {
                return '-';
            }
        }

        function getStatusBadgeClass(status) {
            if (!status) return 'bg-secondary';
            switch (status.toLowerCase()) {
                case 'open': return 'bg-primary';
                case 'in-progress':
                case 'in progress': return 'bg-warning text-dark';
                case 'resolved': return 'bg-success';
                case 'closed': return 'bg-secondary';
                case 'escalated': return 'bg-danger';
                case 'pending': return 'bg-info';
                default: return 'bg-secondary';
            }
        }

        function getPriorityBadgeClass(priority) {
            if (!priority) return 'bg-secondary';
            switch (priority.toLowerCase()) {
                case 'high': return 'bg-danger';
                case 'medium': return 'bg-warning text-dark';
                case 'low': return 'bg-info';
                default: return 'bg-secondary';
            }
        }

        function getUserId() {
            // Get user ID from localStorage or session
            return localStorage.getItem('helpdesk_user_id') || sessionStorage.getItem('helpdesk_user_id') || 1;
        }

        function getUserName() {
            return localStorage.getItem('user_name') || sessionStorage.getItem('user_name') || 'User';
        }

        // ============ API FUNCTIONS ============

        async function fetchTicketDetails(ticketId) {
            try {
                const payload = {
                    action: "function_call",
                    function_name: "fn_get_ticket_details",
                    params: { p_ticket_id: ticketId },
                };

                const response = await $.ajax({
                    url: `${BASE_API_URL}/commonfunction`,
                    method: "POST",
                    data: { data: encryptData(payload) },
                    dataType: "json",
                    beforeSend: () => showLoading(true)
                });

                if (!response?.data) {
                    throw new Error('No data received from server');
                }

                const decrypted = decryptData(response.data);
                const parsed = typeof decrypted === 'string' ? JSON.parse(decrypted) : decrypted;
                const jsonString = parsed[0]?.fn_get_ticket_details;

                if (!jsonString) {
                    throw new Error('Invalid response format');
                }

                const detailsObj = JSON.parse(jsonString);
                return detailsObj;

            } catch (error) {
                console.error('Error fetching ticket details:', error);
                throw error;
            } finally {
                showLoading(false);
            }
        }

        async function updateTicketStatus(ticketId, status, priority, comment) {
            try {
                const payload = {
                    action: "function_call",
                    function_name: "fn_update_ticket_status",
                    params: {
                        p_ticket_id: ticketId,
                        p_status: status || null,
                        p_priority: priority || null,
                        p_comments: comment || null,
                        p_updated_by: getUserId()
                    }
                };

                const response = await $.ajax({
                    url: `${BASE_API_URL}/commonfunction`,
                    method: "POST",
                    data: { data: encryptData(payload) },
                    dataType: "json",
                    beforeSend: () => showLoading(true)
                });

                if (response?.success) {
                    return { success: true, message: 'Ticket updated successfully!' };
                } else {
                    throw new Error(response?.message || 'Update failed');
                }
            } catch (error) {
                console.error('Error updating ticket:', error);
                return { success: false, message: error.message || 'Failed to update ticket' };
            } finally {
                showLoading(false);
            }
        }

        async function escalateTicket(ticketId, assignedTo, note) {
            try {
                const payload = {
                    action: "function_call",
                    function_name: "fn_common_forward_ticket",
                    params: {
                        p_ticket_id: ticketId,
                        p_assigned_to: assignedTo,
                        p_notes: note,
                        p_escalated_by: getUserId()
                    }
                };

                const response = await $.ajax({
                    url: `${BASE_API_URL}/commonfunction`,
                    method: "POST",
                    data: { data: encryptData(payload) },
                    dataType: "json",
                    beforeSend: () => showLoading(true)
                });

                return response?.success || false;
            } catch (error) {
                console.error('Error escalating ticket:', error);
                return false;
            } finally {
                showLoading(false);
            }
        }

        async function returnTicket(ticketId, note) {
            try {
                const payload = {
                    action: "function_call",
                    function_name: "fn_common_return_ticket",
                    params: {
                        p_ticket_id: ticketId,
                        p_returned_by: getUserId(),
                        p_return_notes: note,
                    }
                };

                const response = await $.ajax({
                    url: `${BASE_API_URL}/commonfunction`,
                    method: "POST",
                    data: { data: encryptData(payload) },
                    dataType: "json",
                    beforeSend: () => showLoading(true)
                });

                return response?.success || false;
            } catch (error) {
                console.error('Error returning ticket:', error);
                return false;
            } finally {
                showLoading(false);
            }
        }

        async function closeTicket(ticketId, note, status) {
            try {
                const payload = {
                    action: "function_call",
                    function_name: "fn_common_resolve_ticket",
                    params: {
                        p_ticket_id: ticketId,
                        p_closing_notes: note,
                        p_final_status: status,
                        p_closed_by: getUserId()
                    }
                };

                const response = await $.ajax({
                    url: `${BASE_API_URL}/commonfunction`,
                    method: "POST",
                    data: { data: encryptData(payload) },
                    dataType: "json",
                    beforeSend: () => showLoading(true)
                });

                return response?.success || false;
            } catch (error) {
                console.error('Error closing ticket:', error);
                return false;
            } finally {
                showLoading(false);
            }
        }

        async function reassignTicket(ticketId, assignedTo, note) {
            try {
                const payload = {
                    action: "function_call",
                    function_name: "fn_reassign_ticket",
                    params: {
                        p_ticket_id: ticketId,
                        p_assigned_to: assignedTo,
                        p_notes: note,
                        p_reassigned_by: getUserId()
                    }
                };

                const response = await $.ajax({
                    url: `${BASE_API_URL}/commonfunction`,
                    method: "POST",
                    data: { data: encryptData(payload) },
                    dataType: "json",
                    beforeSend: () => showLoading(true)
                });

                return response?.success || false;
            } catch (error) {
                console.error('Error reassigning ticket:', error);
                return false;
            } finally {
                showLoading(false);
            }
        }

        async function getAvailableAgents() {
            try {
                const payload = {
                    action: "function_call",
                    function_name: "fn_forward_to",
                    params: {
                        p_user_id: getUserId(),
                        p_ticket_district: currentTicketData?.ticket_details?.district || null,
                    }
                };

                const response = await $.ajax({
                    url: `${BASE_API_URL}/commonfunction`,
                    method: "POST",
                    data: { data: encryptData(payload) },
                    dataType: "json"
                });

                if (response?.data) {
                    const decrypted = decryptData(response.data);
                    const parsed = typeof decrypted === 'string'
                        ? JSON.parse(decrypted)
                        : decrypted;

                    // 🔑 extract fn_forward_to & parse again
                    const agents = parsed?.[0]?.fn_forward_to
                        ? JSON.parse(parsed[0].fn_forward_to)
                        : [];

                    return agents;
                }
                return [];
            } catch (error) {
                console.error('Error fetching agents:', error);
                return [];
            }
        }


        // ============ RENDER FUNCTIONS ============

        function renderTicketDetails(details) {
            const t = details.ticket_details || {};
            const g = details.grievance_details || {};
            const timeline = Array.isArray(details.progress_timeline) ? details.progress_timeline : [];
            const attachments = Array.isArray(details.attachments) ? details.attachments : [];
            const fileUrl = `${window.BASE_UPLOAD_URL}`;
            // Store current data
            currentTicketData = details;
            currentTicketId = t.ticket_id;


            const mainContent = document.getElementById('mainContent');
            mainContent.innerHTML = `
        <div class="container py-4">
          <!-- Page Header -->
          <div class="page-header d-flex justify-content-between align-items-center">
            <h3><i class="bi bi-ticket-detailed me-2"></i> Ticket #${t.ticket_id || '-'}</h3>
            <div>
              <a href="dashboard.html" class="btn btn-outline-secondary btn-sm me-2">
                <i class="bi bi-arrow-left"></i> Back to Dashboard
              </a>
              <button type="button" class="btn btn-outline-primary btn-sm" id="refreshBtn">
                <i class="bi bi-arrow-clockwise"></i> Refresh
              </button>
            </div>
          </div>

          <!-- Ticket Meta -->
          <div class="ticket-meta">
            <div class="row mb-3">
              <div class="col-md-8">
                <h4>${t.ticket_id || 'No Subject'}</h4>
                <div class="d-flex flex-wrap gap-2 mb-2">
                  <span class="badge ${getStatusBadgeClass(t.status)} fs-6 px-3 py-2">${t.status || 'Unknown'}</span>
                  <span class="badge ${getPriorityBadgeClass(t.priority)} fs-6 px-3 py-2">${t.priority || 'Normal'}</span>
                </div>
              </div>
              <div class="col-md-4 text-md-end">
                <p class="mb-1"><strong><i class="bi bi-calendar-plus"></i> Created:</strong> ${formatDateTime(t.created_at)}</p>
                <p class="mb-1"><strong><i class="bi bi-calendar-check"></i> Updated:</strong> ${formatDateTime(t.updated_at || t.created_at)}</p>
                ${t.resolution_due_date ? `<p class="mb-1"><strong><i class="bi bi-clock"></i> Due:</strong> ${formatDateTime(t.resolution_due_date)}</p>` : ''}
              </div>
            </div>
            
            <div class="row mt-3">
              <div class="col-md-6">
                <p><strong><i class="bi bi-person-check"></i> Assigned To:</strong> ${t.assigned_to_name || 'Not Assigned'}</p>
                <p><strong><i class="bi bi-tags"></i> Category:</strong> ${t.category || '-'}</p>
              </div>
              <div class="col-md-6">
                <p><strong><i class="bi bi-exclamation-octagon"></i> Issue Type:</strong> ${t.issue_type || '-'}</p>
                <p><strong><i class="bi bi-tag"></i> Subcategory:</strong> ${t.subcategory || '-'}</p>
              </div>
            </div>
            
            <hr>
            
            <!-- User Information -->
            <div class="row mt-3">
              <div class="col-12">
                <h5><i class="bi bi-person-circle me-2"></i> User Information</h5>
                <div class="row bg-light p-3 rounded">
                  <div class="col-md-3 mb-2">
                    <strong>Name:</strong><br>
                    <span class="text-primary">${t.complainant_name || '-'}</span>
                  </div>
                  <div class="col-md-3 mb-2">
                    <strong>User Type:</strong><br>
                    <span>${t.user_type || '-'}</span>
                  </div>
                </div>
              </div>
            </div>
            
            <!-- Description -->
            <div class="mt-4">
              <h5><i class="bi bi-chat-text me-2"></i> Description</h5>
              <div class="alert alert-light border p-3">
                ${g.p_description_of_complaint || 'No description provided.'}
              </div>
            </div>
            
            <!-- Grievance Details -->
            ${g.CAN_Number || g.application_number ? `
            <div class="mt-4">
              <h5><i class="bi bi-file-earmark-text me-2"></i> Grievance Details</h5>
              <div class="row bg-light p-3 rounded">
                ${g.CAN_Number ? `
                <div class="col-md-4 mb-2">
                  <strong>CAN Number:</strong><br>
                  <span class="text-primary">${g.CAN_Number}</span>
                </div>
                ` : ''}
                ${g.application_number ? `
                <div class="col-md-4 mb-2">
                  <strong>Application Number:</strong><br>
                  <span class="text-primary">${g.application_number}</span>
                </div>
                ` : ''}
                ${g.application_date ? `
                <div class="col-md-4 mb-2">
                  <strong>Application Date:</strong><br>
                  <span>${formatDateTime(g.application_date)}</span>
                </div>
                ` : ''}
              </div>
            </div>
            ` : ''}
            
            <!-- Attachments -->
            ${attachments.length > 0 ? `
            <div class="mt-4">
              <h5><i class="bi bi-paperclip me-2"></i> Attachments (${attachments.length})</h5>
              <div class="row">
                ${attachments.map((file, index) => `
                  <div class="col-md-4 mb-3">
                    <div class="card h-100">
                      <div class="card-body">
                        <div class="d-flex align-items-center mb-2">
                          <i class="bi bi-file-earmark me-2 fs-4 text-primary"></i>
                          <h6 class="card-title mb-0 text-truncate">${file.file_name || `Attachment ${index + 1}`}</h6>
                        </div>
                        ${file.file_type ? `<span class="badge bg-secondary">${file.file_type}</span>` : ''}
                        ${file.file_size ? `<small class="text-muted d-block mt-1">${formatFileSize(file.file_size)}</small>` : ''}
                        ${file.uploaded_at ? `<small class="text-muted d-block">${formatDateTime(file.uploaded_at)}</small>` : ''}
                      </div>
                      <div class="card-footer bg-transparent border-top-0">
                        <a href="${fileUrl + file.file_name || '#'}" target="_blank" class="btn btn-sm btn-outline-primary w-100">
                          <i class="bi bi-download"></i> Download
                        </a>
                      </div>
                    </div>
                  </div>
                `).join('')}
              </div>
            </div>
            ` : ''}
          </div>

          <!-- Action Box -->
          <div class="action-box">
            <form id="ticketActionForm">
              <!-- Action Buttons -->
              <div class="action-buttons">
                <button type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#escalateModal">
                  <i class="bi bi-arrow-up-circle"></i> Forward
                </button>
                <button type="button" class="btn btn-warning" data-bs-toggle="modal" data-bs-target="#resolveModal">
                  <i class="bi bi-arrow-return-left"></i> Return/Send Back
                </button>
                <button type="button" class="btn btn-dark" data-bs-toggle="modal" data-bs-target="#closeModal">
                  <i class="bi bi-x-circle"></i> Close
                </button>
                <button type="button" class="btn btn-info" data-bs-toggle="modal" data-bs-target="#reassignModal">
                  <i class="bi bi-arrow-repeat"></i> Re-Assign
                </button>
              </div>
            </form>

            <!-- Progress Timeline -->
            <div class="comment-box mt-4">
              <h5><i class="bi bi-clock-history me-2"></i> Progress Timeline</h5>
              ${timeline.length > 0 ? `
                <div class="timeline mt-3">
                  ${timeline.map((item, index) => `
                    <div class="timeline-item ${index === 0 ? 'timeline-item-first' : ''} ${index === timeline.length - 1 ? 'timeline-item-last' : ''}">
                      <div class="timeline-content">
                        <div class="d-flex justify-content-between align-items-start mb-2">
                          <strong class="text-primary">${item.role_name || 'System'}</strong>
                          <small class="text-muted">${formatDateTime(item.start_time)}</small>
                        </div>
                        <p class="mb-2">${item.notes || 'No notes provided'}</p>
                        <div class="d-flex gap-3 align-items-center">
                          <div>
                            <small class="text-muted">To:</small>
                            <span class="badge ${getStatusBadgeClass(item.to_status)} ms-1">${item.to_status || '-'}</span>
                          </div>
                        </div>
                        ${item.action_by_name ? `<small class="text-muted d-block mt-1"><i class="bi bi-person"></i> By: ${item.action_by_name}</small>` : ''}
                      </div>
                    </div>
                  `).join('')}
                </div>
              ` : `
                <div class="alert alert-info">
                  <i class="bi bi-info-circle"></i> No timeline updates available.
                </div>
              `}
            </div>
          </div>
        </div>
      `;

            // Add event listeners
            document.getElementById('refreshBtn')?.addEventListener('click', () => loadTicketData());
            document.getElementById('saveUpdateBtn')?.addEventListener('click', handleSaveUpdate);

            // Initialize tooltips
            $('[data-bs-toggle="tooltip"]').tooltip();
        }

        function formatFileSize(bytes) {
            if (bytes === 0) return '0 Bytes';
            const k = 1024;
            const sizes = ['Bytes', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
        }

        // ============ EVENT HANDLERS ============

        async function handleSaveUpdate() {
            const status = document.getElementById('statusSelect').value;
            const priority = document.getElementById('prioritySelect').value;
            const comment = document.getElementById('commentText').value;

            if (!status && !priority && !comment) {
                showToast('Please make at least one change before saving.', 'warning');
                return;
            }

            const result = await updateTicketStatus(currentTicketId, status, priority, comment);
            if (result.success) {
                showToast(result.message, 'success');
                // Reload ticket data
                setTimeout(() => loadTicketData(), 1000);
            } else {
                showToast(result.message, 'danger');
            }
        }

        async function populateAgentDropdowns() {
            const agents = await getAvailableAgents();
            const selects = ['agentDropdown', 'reassignSelect'];

            selects.forEach(selectId => {
                const select = document.getElementById(selectId);
                if (select) {
                    select.innerHTML = '<option value="">Select Agent</option>' +
                        agents.map(agent => `
              <option value="${agent.user_id}">
                ${agent.user_name || agent.user_name || 'Unknown'} 
                ${agent.department ? `- ${agent.department}` : ''}
                ${agent.role ? `(${agent.role})` : ''}
              </option>
            `).join('');
                }
            });
        }

        // ============ MODAL HANDLERS ============

        function initializeModals() {
            // Forward modal
            const escalateModal = document.getElementById('escalateModal');
            if (escalateModal) {
                escalateModal.addEventListener('show.bs.modal', populateAgentDropdowns);

                document.getElementById('escalateConfirmBtn').addEventListener('click', async () => {
                    const assignTo = document.getElementById('agentDropdown').value;
                    const note = document.getElementById('escalateNote').value;

                    if (!assignTo) {
                        showToast('Please select an agent to forward to', 'warning');
                        return;
                    }

                    if (!note.trim()) {
                        showToast('Please enter a forward note', 'warning');
                        return;
                    }

                    const success = await escalateTicket(currentTicketId, assignTo, note);
                    if (success) {
                        showToast('Ticket forwarded successfully!', 'success');
                        bootstrap.Modal.getInstance(escalateModal).hide();
                        setTimeout(() => loadTicketData(), 1000);
                    } else {
                        showToast('Failed to forward ticket', 'danger');
                    }
                });
            }

            // Return modal
            const resolveModal = document.getElementById('resolveModal');
            if (resolveModal) {
                document.getElementById('resolveConfirmBtn').addEventListener('click', async () => {
                    const note = document.getElementById('resolveNote').value;

                    if (!note.trim()) {
                        showToast('Please enter a return note', 'warning');
                        return;
                    }

                    const success = await returnTicket(currentTicketId, note);
                    if (success) {
                        showToast('Ticket returned successfully!', 'success');
                        bootstrap.Modal.getInstance(resolveModal).hide();
                        setTimeout(() => loadTicketData(), 1000);
                    } else {
                        showToast('Failed to return ticket', 'danger');
                    }
                });
            }

            // Close modal
            const closeModal = document.getElementById('closeModal');
            if (closeModal) {
                document.getElementById('closeConfirmBtn').addEventListener('click', async () => {
                    const note = document.getElementById('closeNote').value;
                    const status = document.getElementById('closeStatus').value;

                    if (!note.trim()) {
                        showToast('Please enter a closing note', 'warning');
                        return;
                    }

                    if (!status) {
                        showToast('Please select a resolution status', 'warning');
                        return;
                    }

                    const success = await closeTicket(currentTicketId, note, status);
                    if (success) {
                        showToast('Ticket closed successfully!', 'success');
                        bootstrap.Modal.getInstance(closeModal).hide();
                        setTimeout(() => loadTicketData(), 1000);
                    } else {
                        showToast('Failed to close ticket', 'danger');
                    }
                });
            }

            // Reassign modal
            const reassignModal = document.getElementById('reassignModal');
            if (reassignModal) {
                reassignModal.addEventListener('show.bs.modal', populateAgentDropdowns);

                document.getElementById('reassignConfirmBtn').addEventListener('click', async () => {
                    const assignTo = document.getElementById('reassignSelect').value;
                    const note = document.getElementById('reassignNote').value;

                    if (!assignTo) {
                        showToast('Please select an agent to reassign to', 'warning');
                        return;
                    }

                    if (!note.trim()) {
                        showToast('Please enter a reassign note', 'warning');
                        return;
                    }

                    const success = await reassignTicket(currentTicketId, assignTo, note);
                    if (success) {
                        showToast('Ticket reassigned successfully!', 'success');
                        bootstrap.Modal.getInstance(reassignModal).hide();
                        setTimeout(() => loadTicketData(), 1000);
                    } else {
                        showToast('Failed to reassign ticket', 'danger');
                    }
                });
            }
        }

        // ============ MAIN LOAD FUNCTION ============

        async function loadTicketData() {
            const ticketId = getUrlParameter('id');

            if (!ticketId) {
                document.getElementById('mainContent').innerHTML = `
          <div class="container py-4">
            <div class="alert alert-danger">
              <h4><i class="bi bi-exclamation-triangle"></i> Error</h4>
              <p>No ticket ID specified. Please select a ticket from the dashboard.</p>
              <a href="dashboard.html" class="btn btn-outline-danger">
                <i class="bi bi-arrow-left"></i> Go to Dashboard
              </a>
            </div>
          </div>
        `;
                return;
            }

            currentTicketId = ticketId;

            try {
                const ticketDetails = await fetchTicketDetails(ticketId);
                if (!ticketDetails) {
                    throw new Error('Failed to load ticket details');
                }
                renderTicketDetails(ticketDetails);
                initializeModals();
            } catch (error) {
                console.error('Error loading ticket:', error);
                document.getElementById('mainContent').innerHTML = `
          <div class="container py-4">
            <div class="alert alert-danger">
              <h4><i class="bi bi-exclamation-triangle"></i> Error Loading Ticket</h4>
              <p>Failed to load ticket details. Please try again.</p>
              <p class="text-muted small">Error: ${error.message}</p>
              <div class="mt-3">
                <a href="dashboard.html" class="btn btn-outline-danger me-2">
                  <i class="bi bi-arrow-left"></i> Go to Dashboard
                </a>
                <button class="btn btn-primary" onclick="loadTicketData()">
                  <i class="bi bi-arrow-clockwise"></i> Retry
                </button>
              </div>
            </div>
          </div>
        `;
            }
        }

        // ============ INITIALIZATION ============

        $(document).ready(function () {
            // Set user name
            document.getElementById('userName').textContent = getUserName();

            // Initialize sidebar
            const sidebarToggle = document.getElementById('sidebarToggle');
            const sidebar = document.getElementById('sidebar');

            sidebarToggle.addEventListener('click', () => {
                if (window.innerWidth < 992) {
                    sidebar.classList.toggle('show');
                } else {
                    document.body.classList.toggle('sidebar-collapsed');
                }
            });

            // Close mobile sidebar when clicking outside
            document.addEventListener('click', function (e) {
                if (window.innerWidth < 992) {
                    if (!sidebar.contains(e.target) && !sidebarToggle.contains(e.target)) {
                        sidebar.classList.remove('show');
                    }
                }
            });

            // Display current date and time
            function updateDateTime() {
                const now = new Date();
                const options = { weekday: 'short', year: 'numeric', month: 'short', day: 'numeric' };
                const timeString = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                const dateTimeString = now.toLocaleDateString(undefined, options) + ' ' + timeString;
                document.getElementById('currentDateTime').textContent = dateTimeString;
            }

            setInterval(updateDateTime, 1000);
            updateDateTime();

            // Global AJAX error handler
            $(document).ajaxError(function (event, jqxhr, settings, thrownError) {
                showLoading(false);
                console.error('AJAX Error:', settings.url, thrownError);

                if (jqxhr.status === 401) {
                    showToast('Session expired. Please login again.', 'warning');
                    setTimeout(() => window.location.href = 'index.html', 2000);
                } else if (jqxhr.status === 0) {
                    showToast('Network error. Please check your internet connection.', 'danger');
                } else if (jqxhr.status === 500) {
                    showToast('Server error. Please try again later.', 'danger');
                }
            });

            // Load ticket data
            loadTicketData();
        });
    </script>
</body>

</html>
